name: Rename a term
description: Give an existing term a new slug (and optionally a new label). The old slug is retired and points to the new one.
title: "Rename term: "
labels: ["change:rename"]
body:
  - type: input
    id: old
    attributes:
      label: Old term
      description: The slug as it is now.
    validations:
      required: true
  - type: input
    id: new
    attributes:
      label: New term
      description: The new slug.
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: New label (optional)
      description: Leave blank to keep the current label.
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Effective date (optional)
      description: YYYY-MM-DD. Leave blank for today.
