name: Move a term
description: Put a term under a different broader term, or at the top level. No dataset changes.
title: "Move term: "
labels: ["change:move"]
body:
  - type: input
    id: term
    attributes:
      label: Term to move
    validations:
      required: true
  - type: input
    id: broader
    attributes:
      label: New broader term
      description: The slug it goes under (same facet). Write "top" to make it a top-level term.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Effective date (optional)
      description: YYYY-MM-DD. Leave blank for today.
