[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crsw-deposit"
version = "0.5.0"
description = "CRSW deposit conventions, command-line tool and web deposit service"
requires-python = ">=3.8"
# crsw_deposit itself has NO runtime dependencies: the CLI runs from a
# checkout on stdlib alone. Everything below is opt-in.
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "moto[s3]>=5",
    "jsonschema>=4",
]

[tool.setuptools]
packages = ["crsw_deposit", "crsw_web"]

[tool.setuptools.package-data]
crsw_deposit = ["vocab.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
