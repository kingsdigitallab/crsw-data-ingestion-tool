# nginx sidecar for the CRSW web deposit service.
# Rendered by envsubst at container start (see compose.yaml); the
# variables are CRSW_MAX_BODY and the allow-list file it generates.
#
# Bodies pass straight through to the app (no buffering to disk), which
# is the day-one streaming requirement. The size cap is enforced here
# so the app never sees an oversized upload.
#
# TLS, sign-in, group restriction and the web application firewall are
# the KCL reverse proxy's job. This sidecar only accepts connections
# from that proxy (CRSW_TRUSTED_PROXY_CIDRS) when the list is set.
worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;

    client_max_body_size ${CRSW_MAX_BODY};

    # Rate limits. Behind the KCL proxy every request arrives from one of
    # a few load-balancer addresses, so these are per-proxy and coarse;
    # the per-user limit that matters is the staging quota in the app.
    limit_req_zone  $binary_remote_addr zone=create:1m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=uploads:1m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream deposit_web { server deposit-web:8000; }

    server {
        listen 80;

        # Only the KCL proxy may talk to us (generated: allow ...; deny all;).
        include /etc/nginx/allow.conf;

        # Streaming: never spool request bodies to a temp file.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The address that connected to THIS sidecar, for the app's own
        # trusted-proxy check. Always overwritten here, so a client cannot
        # supply it; X-Forwarded-For is a chain the KCL proxy extends and
        # its leftmost entry is the browser, not the proxy.
        proxy_set_header X-Sidecar-Peer $remote_addr;

        # Long enough for a multi-GB upload leg; tune with eResearch.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        # The page's only inline <script> is type=application/json (data,
        # never executed), so 'self' is enough.
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # Health is the one path reachable from anywhere (status, version,
        # auth mode only), so `curl localhost:PORT/health` works on the VM.
        location = /health {
            allow all;
            proxy_pass http://deposit_web;
        }
        location = /deposits {
            limit_req zone=create burst=5 nodelay;
            proxy_pass http://deposit_web;
        }
        location ~ ^/deposits/[^/]+/finalise$ {
            limit_req zone=create burst=5 nodelay;
            proxy_pass http://deposit_web;
        }
        location ~ ^/deposits/[^/]+/files/ {
            limit_conn uploads 4;
            proxy_pass http://deposit_web;
        }
        location / {
            proxy_pass http://deposit_web;
        }
    }
}
