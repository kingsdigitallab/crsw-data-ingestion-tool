# nginx sidecar for the CRSW web deposit service.
# Bodies pass straight through to the app (no buffering to disk), which
# is the day-one streaming requirement. The size cap is enforced here
# so the app never sees an oversized upload.
worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;

    # Upload cap; CRSW_MAX_BODY is substituted by the nginx image's
    # envsubst template mechanism (deploy/compose.yaml sets it).
    client_max_body_size ${CRSW_MAX_BODY};

    upstream deposit_web { server deposit-web:8000; }

    server {
        listen 80;

        # Streaming: never spool request bodies to a temp file.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a multi-GB upload leg; tune with eResearch.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;

        location / {
            proxy_pass http://deposit_web;
        }
    }
}
