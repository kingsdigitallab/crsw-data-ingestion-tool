# CRSW web deposit stack. From the repo root:
#   docker compose -f deploy/compose.yaml up --build
# Reads ../.env for the service key (never committed). No volumes: nothing
# in flight touches disk.
name: crsw-deposit

services:
  deposit-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: crsw-deposit-web:local
    env_file:
      - path: ../.env
        required: true
      - path: ../.env.local      # optional overrides (e.g. proxy mode on the VM)
        required: false
    expose:
      - "8000"
    read_only: true    # and no tmpfs, deliberately: uploads must not touch disk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - deposit-web
    ports:
      - "${CRSW_HTTP_PORT:-8080}:80"
    environment:
      # Consumed by nginx.conf via envsubst at start.
      CRSW_MAX_BODY: ${CRSW_MAX_BODY:-5g}
      # Comma-separated networks the KCL proxy connects from. Empty = allow all (local dev).
      CRSW_TRUSTED_PROXY_CIDRS: ${CRSW_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    # Render the allow-list and the config, then start nginx.
    command: >
      /bin/sh -c "
      : > /etc/nginx/allow.conf;
      if [ -n \"$$CRSW_TRUSTED_PROXY_CIDRS\" ]; then
        for c in $$(echo \"$$CRSW_TRUSTED_PROXY_CIDRS\" | tr ',' ' '); do echo \"allow $$c;\" >> /etc/nginx/allow.conf; done;
        echo 'deny all;' >> /etc/nginx/allow.conf;
      fi;
      envsubst '$$CRSW_MAX_BODY'
      < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    restart: unless-stopped

  # The promoter runs on the INTERNAL VM only, with the real key, from the
  # same image. Start it there with:  docker compose --profile internal run --rm promoter
  # It must never be started on the web VM, and ../.env.promoter must not exist there.
  promoter:
    profiles: ["internal"]
    image: crsw-deposit-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.promoter
    environment:
      PROMOTER_LOG_PATH: /dev/stdout
    command: ["python", "-m", "promoter", "run", "--env-file", "/dev/null"]
    read_only: true
