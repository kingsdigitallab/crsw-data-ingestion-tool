# CRSW web deposit stack. From the repo root:
#   docker compose -f deploy/compose.yaml up --build
# Reads ../.env for the service key (never committed). No volumes: nothing
# in flight touches disk.
name: crsw-deposit

services:
  deposit-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: crsw-deposit-web:local
    env_file:
      - ../.env
    environment:
      CRSW_AUTH_MODE: ${CRSW_AUTH_MODE:-placeholder}
    expose:
      - "8000"
    read_only: true    # and no tmpfs, deliberately: uploads must not touch disk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - deposit-web
    ports:
      - "${CRSW_HTTP_PORT:-8080}:80"
    environment:
      # Consumed by nginx.conf via the image's envsubst templating.
      CRSW_MAX_BODY: ${CRSW_MAX_BODY:-5g}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    # The stock image only templates into conf.d; we want the whole
    # config, so render it ourselves then start nginx.
    command: >
      /bin/sh -c "envsubst '$$CRSW_MAX_BODY'
      < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    restart: unless-stopped

  # promoter: added in Phase 4 (runs on the internal VM with the real key).
